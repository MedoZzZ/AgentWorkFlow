name: Framework checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  powershell:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test configuration and runner failures without model access
        shell: pwsh
        run: ./workflow/scripts/Test-Configuration.ps1
      - name: Test managed task lifecycle without model access
        shell: pwsh
        run: ./workflow/scripts/Test-TaskState.ps1
      - name: Test evidence verification recovery and executor supervision
        shell: pwsh
        run: ./workflow/scripts/Test-Evidence.ps1
      - name: Test native Antigravity streaming adapter without model access
        shell: pwsh
        run: ./workflow/scripts/Test-Streaming.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test dashboard APIs and SSE
        run: node --test workflow/dashboard/test/server.test.mjs
      - name: Parse all PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem workflow/scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
